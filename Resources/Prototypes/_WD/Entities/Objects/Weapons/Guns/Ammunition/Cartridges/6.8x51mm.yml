  - type: Tag
    tags:
    - Cartridge
    - Cartridge68x51mm
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: CartridgeAmmo
    proto: Bullet68x51mmFMJ

