# Default
- type: entity
  id: Magazine86x70mm
  name: "magazine (8.6x70mm)"
  suffix: filled, FMJ
  parent: [ BaseItem, RecyclableItemSteelTiny ]
  components:
  - type: Tag
    tags:
    - Magazine86x70mm
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - Cartridge86x70mm
    proto: Cartridge86x70mmFMJ
    capacity: 20
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Magazine/7.62x51mm/7.62x51mm_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

# Empty Mag

- type: entity
  id: Magazine86x70mmEmpty
  name: "magazine (8.6x70mm)"
  suffix: empty
  parent: Magazine86x70mm
  components:
  - type: BallisticAmmoProvider
    proto: null
