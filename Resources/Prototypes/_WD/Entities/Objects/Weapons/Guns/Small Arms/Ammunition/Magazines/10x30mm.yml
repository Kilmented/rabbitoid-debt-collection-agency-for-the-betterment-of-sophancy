- type: entity
  id: Magazine10x30mmPistol
  name: pistol magazine (10x30mm)
  suffix: FMJ
  parent: [ BaseItem, RecyclableItemSteelTiny ]
  components:
  - type: Tag
    tags:
      - Magazine10x30mmPistol
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - Cartridge10x30mm
    proto: Cartridge10x30mmFMJ
    capacity: 12
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Magazine/9x19mm/9x19mm_pistol_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: false
  - type: Appearance

#Start Pistol mags
- type: entity
  id: Magazine10x30mmPistolEmpty
  name: pistol magazine (10x30mm)
  suffix: empty
  parent: Magazine10x30mmPistol
  components:
  - type: BallisticAmmoProvider
    proto: null

