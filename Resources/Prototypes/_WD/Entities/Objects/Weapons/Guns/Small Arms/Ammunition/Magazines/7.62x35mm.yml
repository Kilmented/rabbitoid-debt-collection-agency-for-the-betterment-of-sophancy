# Default
- type: entity
  id: Magazine762x35mm
  name: "magazine (7.62x35mm)"
  suffix: filled, FMJ
  parent: [ BaseItem, RecyclableItemSteelTiny ]
  components:
  - type: Tag
    tags:
    - Magazine762x35mm
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - Cartridge762x35mm
    proto: Cartridge762x35mmFMJ
    capacity: 30
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Magazine/7.62x51mm/7.62x51mm_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

# Empty Mag

- type: entity
  id: Magazine762x35mmEmpty
  name: "magazine (7.62x35mm)"
  suffix: empty
  parent: Magazine762x35mm
  components:
  - type: BallisticAmmoProvider
    proto: null
