- type: entity
  id: WeaponRifleSmle
  name: Test SMLE
  parent: BaseWeaponRifle
  description: "Semi-Automatic rifle chambered in 6.8x51mm."
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Snipers/lee_enfield.rsi
    layers:
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
    - state: base
      map: ["enum.GunVisualLayers.Base"]
  - type: Item # Mono
    size: Huge
    sprite: _Mono/Objects/Weapons/Guns/Snipers/lee_enfield_inhands_32x.rsi
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/Snipers/lee_enfield_inhands_32x.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: GunWieldBonus
    minAngle: -27
    maxAngle: -36
  - type: Gun
    minAngle: 27
    maxAngle: 39
    fireRate: 2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rifle2.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine68x51mm
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - Magazine68x51mm
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge68x51mmFMJ
        priority: 1
        whitelist:
          tags:
          - Cartridge68x51mm
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 7
    pvsIncrease: 0.7
  - type: SpeedModifiedOnWield # Mono
    walkModifier: 0.85
    sprintModifier: 0.85
  - type: StaticPrice
    price: 800
    vendPrice: 12500

- type: entity
  name: Test Bolt Action Rifle
  parent: [BaseWeaponSniper, BaseGunWieldable]
  id: WeaponSniperWDTest
  description: A portable anti-material rifle. Fires high velocity 14.5mm shells. Uses 145x114mm ammo.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Snipers/hristov.rsi
  - type: Clothing
    sprite: Objects/Weapons/Guns/Snipers/hristov.rsi
  - type: GunRequiresWield
  - type: Gun
    fireRate: 0.75
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_Harmony/Weapons/Guns/Gunshots/hristov_fire_alt.ogg # harmony - changed audio path
  - type: BallisticAmmoProvider
    autoCycle: false
    whitelist:
      tags:
      - Cartridge145x114mm
    capacity: 5
    proto: Cartridge145x114mm
  - type: SpeedModifiedOnWield
    walkModifier: 0.25
    sprintModifier: 0.25
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 7 # Mono - Sniper Buff
    pvsIncrease: 0.7 # Mono - Sniper Buff
  - type: StaticPrice # Mono
    price: 1250
